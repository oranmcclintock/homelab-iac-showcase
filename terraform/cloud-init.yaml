#cloud-config
hostname: ${VM_NAME}
package_update: true
package_upgrade: true

users:
  - default
  - name: sweeny
    groups: sudo
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    lock_passwd: false
    passwd: ${SWEENY_PASSWORD_HASH}
    ssh_authorized_keys:
      - ${SSH_PUBLIC_KEY}

packages:
  - curl
  - qemu-guest-agent

runcmd:
  # Enable and start qemu-guest-agent so Proxmox knows the IP
  - systemctl enable qemu-guest-agent
  - systemctl start qemu-guest-agent

  # 1. Install Tailscale
  - curl -fsSL https://tailscale.com/install.sh | sh
  
  # 2. Authenticate to the Tailnet autonomously, wait for DNS to propagate, THEN trigger GitHub Action
  - |
    tailscale up --authkey=${TAILSCALE_AUTHKEY} --ssh=false && \
    sleep 10 && \
    curl -X POST \
      -H "Accept: application/vnd.github.v3+json" \
      -H "Authorization: Bearer ${GITHUB_PAT}" \
      -H "Content-Type: application/json" \
      -H "X-GitHub-Api-Version: 2022-11-28" \
      https://api.github.com/repos/oranmcclintock/homelab-monorepo/actions/workflows/deploy.yml/dispatches \
      -d '{"ref":"main"}'
